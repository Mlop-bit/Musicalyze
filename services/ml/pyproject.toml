[project]
name = "musicalyze-ml"
version = "0.1.0"
description = "Musicalyze: offline training pipeline and runtime feature resolution service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "muq>=0.1",
    "librosa>=0.10",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "rapidfuzz>=3.10",
    "musicbrainzngs>=0.7",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "tensorboard>=2.18",
    "boto3>=1.35",
    "botocore>=1.35",
    "httpx>=0.27",
    "zstandard>=0.23",
]

[project.optional-dependencies]
cpu = ["torch>=2.5"]
cu130 = ["torch>=2.5"]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
    "pre-commit>=4.0",
    "boto3-stubs[s3]>=1.35",
]

[tool.uv]
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu130" },
    ],
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[[tool.pyright.executionEnvironments]]
root = "tests/serving/api"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/ml/core/muq.py"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests/training/test_classifier.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "tests/training/test_experiment_log.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/ml/core/artifact_store.py"
reportUnknownMemberType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/ml/serving/acousticbrainz/download_scripts/download_acousticbrainz.py"
reportCallIssue = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that hit real external APIs (excluded by default)",
]
addopts = "-m 'not live'"
