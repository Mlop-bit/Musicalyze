[project]
name = "musicalyze-ml"
version = "0.1.0"
description = "Musicalyze: offline training pipeline and runtime feature resolution service"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.5",
    "muq>=0.1",
    "librosa>=0.10",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.1",
    "rapidfuzz>=3.10",
    "musicbrainzngs>=0.7",
    "psycopg2-binary>=2.9",
    "pgvector>=0.3",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pyright>=1.1",
    "pytest>=8.3",
    "httpx>=0.27",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "ANN"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.13"

[[tool.pyright.executionEnvironments]]
root = "tests/serving/api"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"

[[tool.pyright.executionEnvironments]]
root = "src/ml/core/muq.py"
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: marks tests that hit real external APIs (excluded by default)",
]
addopts = "-m 'not live'"
